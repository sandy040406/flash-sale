name: flash-sale-system

services:
  # 1. Edge Layer: NGINX Reverse Proxy, Load Balancer & Rate Limiter.
  #    Its upstream list is managed by the autoscaler (healthy replicas only, drained before removal).
  nginx:
    image: nginx:alpine
    container_name: flash_sale_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - upstream_conf:/etc/nginx/upstream.d:ro   # healthy-replica list, written by the autoscaler
    depends_on:
      - backend
    networks:
      - flash_net

  # 2. Application Layer: stateless FastAPI API replicas. Count is managed by the autoscaler
  #    (starts at MIN_REPLICAS, scales on CPU). The stream consumer runs in the `worker` service.
  backend:
    image: flash-sale-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    deploy:
      replicas: ${MIN_REPLICAS:-2}
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUN_WORKER=0
      - DEMO_MODE=${DEMO_MODE:-1}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - TRUST_PROXY_HEADERS=1
      - DATABASE_URL=postgresql+asyncpg://flash:flash@postgres:5432/flashsale
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - flash_net

  # 2b. Dedicated order-persistence workers: same image, no HTTP. Join one Redis consumer group,
  #     so more containers = more database throughput, independent of the API tier.
  worker:
    image: flash-sale-backend:latest
    command: ["python", "-m", "app.worker_main"]
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql+asyncpg://flash:flash@postgres:5432/flashsale
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - flash_net

  # 2c. Autoscaler: scales `backend` between MIN and MAX on average CPU (HPA-style control loop).
  autoscaler:
    build:
      context: ./autoscaler
    container_name: flash_autoscaler
    environment:
      - MIN_REPLICAS=${MIN_REPLICAS:-2}
      - MAX_REPLICAS=${MAX_REPLICAS:-8}
      - TARGET_CPU_PERCENT=${TARGET_CPU_PERCENT:-50}
      - SCALE_DOWN_STABILIZATION_SECONDS=${SCALE_DOWN_STABILIZATION_SECONDS:-60}
      # compose re-evaluates the file when scaling; keep these identical to the API service
      - DEMO_MODE=${DEMO_MODE:-1}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - WORKER_REPLICAS=${WORKER_REPLICAS:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro
      - upstream_conf:/upstream
    depends_on:
      - backend
    networks:
      - flash_net

  # 3a. Shared ACID Database: single source of truth for all replicas
  postgres:
    image: postgres:16-alpine
    container_name: flash_postgres
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      - POSTGRES_USER=flash
      - POSTGRES_PASSWORD=flash
      - POSTGRES_DB=flashsale
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flashsale"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - flash_net

  # 3b. Distributed Cache & Stream Layer: Redis with AOF persistence
  redis:
    image: redis:7-alpine
    container_name: flash_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --protected-mode no
    networks:
      - flash_net

volumes:
  upstream_conf:

networks:
  flash_net:
    driver: bridge
