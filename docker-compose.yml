version: '3.8'

services:
  # 1. Edge Layer: NGINX Reverse Proxy, Load Balancer & Rate Limiter
  nginx:
    image: nginx:alpine
    container_name: flash_sale_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend_1
      - backend_2
      - backend_3
    networks:
      - flash_net

  # 2. Application Layer: Auto-scaled Stateless FastAPI Clusters
  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flash_backend_1
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_NAME=worker_node_1
    depends_on:
      - redis
    networks:
      - flash_net

  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flash_backend_2
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_NAME=worker_node_2
    depends_on:
      - redis
    networks:
      - flash_net

  backend_3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flash_backend_3
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_NAME=worker_node_3
    depends_on:
      - redis
    networks:
      - flash_net

  # 3. Distributed Cache & Stream Layer: High-Performance Redis
  redis:
    image: redis:7-alpine
    container_name: flash_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly no --save "" --protected-mode no
    networks:
      - flash_net

networks:
  flash_net:
    driver: bridge
