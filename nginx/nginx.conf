events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;

    # Gzip Compression (<25KB bundle optimization)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate Limiting (Token Bucket / Leaky Bucket) for Bot Protection
    # 1. Checkout Zone: Strictly limits checkout spam per IP to 15 req/sec
    limit_req_zone $binary_remote_addr zone=checkout_zone:10m rate=15r/s;
    # 2. General API Zone: 50 req/sec
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=50r/s;
    limit_req_status 429;

    # Upstream Stateless Application Cluster (Least Connections Load Balancing).
    # The server list is NOT static: the autoscaler writes the HEALTHY replicas into
    # /etc/nginx/upstream.d/backends.conf and sends NGINX a graceful reload (HUP) on every change.
    #  - a replica is added only after its health check passes (never routed to while booting)
    #  - a replica is removed and drained BEFORE its container is stopped (in-flight requests finish)
    # The placeholder below keeps the block valid before the first list is written.
    upstream backend_cluster {
        least_conn;
        server 127.0.0.1:65535 down;
        include /etc/nginx/upstream.d/*.conf;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost;

        # Edge CDN Simulation: Direct Static Asset Caching
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # Frontend shell + bundle served straight from the edge (never hits the app tier)
        root /usr/share/nginx/html;

        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache";
        }

        location ~ ^/(app\.js|styles\.css)$ {
            add_header Cache-Control "no-cache";  # revalidate (ETag/304); use fingerprinted filenames + long max-age in real prod
            access_log off;
        }

        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # Retry another replica when a connection can't be established.
        # Retry on connect errors/timeouts (just-removed replicas) and on a connection reset mid-request.
        # `non_idempotent` lets NGINX retry POSTs too. That is safe HERE because checkout is idempotent
        # by design: the Lua script keys claims by user_id, so a repeat returns the original ticket
        # (409) instead of reserving a second unit.
        proxy_next_upstream error timeout non_idempotent;
        proxy_next_upstream_tries 5;

        # DEMO ONLY: no per-IP limit. Backend returns 404 unless DEMO_MODE=1.
        location /api/v1/demo/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 1s;
            proxy_read_timeout 15s;
        }

        # Rate-Limited Ingestion for Flash Sale Checkout
        location /api/v1/checkout {
            limit_req zone=checkout_zone burst=25 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 1s;
            proxy_read_timeout 15s;
        }

        # Server-Sent Events (SSE) Stream Configuration
        location /api/v1/checkout/sse/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 120s;
        }

        # Default Reverse Proxy Route
        location / {
            limit_req zone=api_zone burst=50 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
